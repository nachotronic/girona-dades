		<h1 style="display: none;">Apellidos y nombres</h1>
		<h2 style="display: none;">Buscador de apellidos y nombres</h2>
		<script type="text/javascript">
			/* Script for app NombApell */
			var thisurl = document.location.href;
			var pos=thisurl.indexOf("?");

			if(pos==-1) pos=thisurl.length; else pos++;

			var query=thisurl.substring(pos, thisurl.length);
			var posL=query.indexOf("L=");
			var idioma=query.substring(posL+2,posL+3);

			var minWidth  = 285;
			var minHeight = 320;
			var height = document.body.offsetHeight < minHeight  ? minHeight : Math.round(document.body.offsetHeight);
			var width  = document.body.offsetWidth < minWidth  ? minWidth : Math.round(document.body.offsetWidth);

			let scr = document.createElement("script");
			scr.async = false;
			scr.src = "/widgets/nombApell/nombApell.js?L=" + idioma + "&w=" + width + "px&h=" + height + "px";
			document.head.append(scr);
		</script>
		<script src="/widgets/nombApell/pwa.js"></script>

			Es necesario disponer de Javascript para el correcto funcionamiento del widget.
