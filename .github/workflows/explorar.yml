name: Explorar fuentes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/actualizar.py cgpj interior policia
      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exploracion data/processed data/estado.md data/estado.json
          git commit -m "Exploración de fuentes" || echo "Sin cambios"
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME"
