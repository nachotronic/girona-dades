name: Prova urbans (temporal)
on:
  push:
    branches: [claude/project-thread-79cqda]
    paths: [".github/workflows/urbans-tmp.yml", "fuentes/urbans.py"]
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/actualizar.py urbans
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed data/estado.md data/estado.json
          git commit -m "Actualizar datos" || exit 0
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME"
