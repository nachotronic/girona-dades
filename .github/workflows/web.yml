name: Publicar web

on:
  push:
    branches: [main]
    paths: ["web/**", "scripts/construir_web.py", "scripts/referencia/**", "lloc.yml", ".github/workflows/web.yml"]
  workflow_run:
    workflows: ["Actualizar datos"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/construir_web.py
      # Capa de referencia para buscadores e IAs: páginas estáticas por municipio, indicador y tema, descargas CSV/JSON,
      # llms.txt, sitemap.xml y robots.txt. Los valores se calculan con el propio mapa (web/mapa.js) en un Chromium sin pantalla.
      # Si falla, la web interactiva se publica igual.
      - name: Páginas de referencia
        continue-on-error: true
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
          node scripts/referencia/extreu.mjs web build/referencia.json
          VERSIO=${GITHUB_SHA::8} python scripts/referencia/genera.py build/referencia.json --publica
          ls web/ca web/es && head -5 web/llms.txt
      # Versiona CSS y JS en cada publicación para que el navegador no mezcle un index.html nuevo con estilos viejos en caché
      - run: sed -i -E "s/(href|src)=\"([a-z]+\.(css|js))\"/\1=\"\2?v=${GITHUB_SHA::8}\"/g" web/index.html && grep -E "estilos|mapa\.js" web/index.html
      # Igual con los datos: sin versión, el navegador puede usar 10 minutos un municipios.json viejo con un mapa.js nuevo
      - run: sed -i -E "s/fetch\(([\"\`])(datos\/[^\"\`?]+)\1/fetch(\1\2?v=${GITHUB_SHA::8}\1/g" web/*.js && grep -c "?v=" web/app.js web/mapa.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
